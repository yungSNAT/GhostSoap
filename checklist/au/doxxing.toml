rank = 120
title = "If you are doxxed or your privacy is seriously invaded"
why = "Doxxing is the intentional online exposure of a person's identity, private information or personal details without their consent with the intent of causing harm, and it can compromise their safety. GhostSoap prepares no reports or claims; these services can act."
steps = [
  "If you are in immediate danger or at risk of harm in Australia, call Triple Zero (000).",
  "Report the material to the platform where it is posted; the eSafety Guide links the reporting tools of many popular platforms.",
  "Report serious online abuse to eSafety, and seek help from the police or a legal, counselling or support service.",
  "For the statutory tort for serious invasions of privacy (Privacy Act Schedule 2, from 10 June 2025), ask a community legal service for advice. A claim must generally start within 1 year of learning of the invasion and within 3 years of it.",
]
applies = "Only if someone has published your personal details to harm or threaten you, or has seriously invaded your privacy"
effort = "longer"

