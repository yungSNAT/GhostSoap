rank = 110
title = "Check what your social media profiles show"
why = "What you post and your privacy settings decide what strangers can learn about you, including where your photos were taken."
steps = [
  "Search your name on each platform you use, to see what is visible, and change anything you do not want public.",
  "Turn off geo-tagging in each platform's privacy settings, so others cannot see where your photos or videos were taken or your posts were made.",
  "Review your friend and follower lists, and be wary of accepting new ones.",
  "Limit what you post and share, and be wary when using tags or commenting on posts.",
  "The eSafety Guide links the privacy settings and reporting tools of common platforms.",
]
applies = "Everyone with a social media account"
effort = "an-hour"
recheck_months = 12

