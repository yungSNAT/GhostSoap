rank = 40
title = "Put your numbers on the Do Not Call Register"
why = "Telemarketers must follow the register's rules, so registering is how the ACMA says to stop telemarketing calls, including to a silent number."
steps = [
  "Register each number you hold that is used mainly for private or domestic purposes, as the account holder or a nominee.",
  "A number stays on the register indefinitely unless you remove it.",
]
applies = "Everyone with a phone number used mainly for private or domestic purposes"
effort = "minutes"

