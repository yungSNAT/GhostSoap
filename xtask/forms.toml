# Every web form the register sends users to: each web-form channel that carries a request,
# and each overseas entry's own form. `cargo run -p xtask -- form-check` requests each page
# once a week, never submitting it, and fails if one is gone or no longer serves a field
# listed here. `fields` are the `name` attributes of the fields a user fills in from what
# GhostSoap gives them (their name, contact details and the letter), as the page serves
# them; `cargo run -p xtask -- form-fields <url>` lists them. A form whose fields a plain
# request cannot see is `unchecked`, with the reason, and is still requested.
# A test fails when this list and the register disagree. Last read: 19 November 2026.

[[form]]
url = "https://www.afterpay.com/en-AU/submit-form"
fields = ["firstName", "lastName", "email", "description"]

